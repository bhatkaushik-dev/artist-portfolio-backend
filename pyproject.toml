[project]
name = "artist-portfolio-api"
version = "1.0.0"
description = "FastAPI backend and single source of truth for an ISR artist portfolio site and its JSON-LD schema builder."
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "greenlet==3.1.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "email-validator==2.2.0",
    "pillow==11.1.0",
    "httpx==0.28.1",
    "supabase==2.11.0",
    "python-multipart==0.0.20",
    "anyio==4.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "BLE", "RUF"]
ignore = [
    "B008",    # FastAPI's Depends/Query/File defaults are the documented idiom
    "RUF001",  # en dashes and em dashes are intentional in the seeded prose
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
